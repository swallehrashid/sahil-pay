# =============================================================================
# Sahil Pay — nginx site config for sahilpay.co.ke
# =============================================================================
# One domain serves everything (this shape is REQUIRED: the M-Pesa C2B
# validation/confirmation URLs are already registered with Safaricom against
# https://sahilpay.co.ke/api/... and re-registering is not an option):
#   /              → React build (static files, SPA fallback)
#   /api/          → Flask via gunicorn on 127.0.0.1:8000
#
# Install:  sudo cp deploy/nginx/sahilpay.conf /etc/nginx/sites-available/sahilpay
#           sudo ln -s /etc/nginx/sites-available/sahilpay /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see DEPLOYMENT_GUIDE.md §7) — it rewrites this file to add
# the ssl_certificate lines and the HTTP→HTTPS redirect automatically.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name sahilpay.co.ke www.sahilpay.co.ke;

    # --- Frontend: static React build -------------------------------------
    root /var/www/sahilpay/client;
    index index.html;

    # Hashed Vite assets are immutable — cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every non-file route serves index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached (it references the hashed assets).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # --- Backend: Flask API ------------------------------------------------
    # Includes /api/webhooks/daraja/* — Safaricom posts here. Do not add any
    # auth/allowlist at this layer; the app validates webhook payloads itself.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;    # WeasyPrint report generation can be slow
        client_max_body_size 20m;   # document / image uploads
    }

    # --- Hardening -----------------------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
